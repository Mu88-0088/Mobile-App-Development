name: project
description: "Concert Ticketing App with Firebase backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0   # Changed from beta to stable

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1   # Load concert images from Firebase Storage
  intl: ^0.19.0                  # Date/number formatting

  # ── MAPS & QR (already had these, keep them) ────────
  qr_flutter: ^4.1.0             # QR code generation for tickets
  google_maps_flutter: ^2.17.0   # Venue location maps
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  url_launcher: ^6.2.5

  # ── FIREBASE ────────────────────────────────────────
  firebase_core: ^3.6.0          # Required by ALL Firebase services
  firebase_auth: ^5.3.1          # Login, signup, password reset
  cloud_firestore: ^5.4.4        # NoSQL database for all app data
  firebase_storage: ^12.3.3      # Store images (concert banners, profile pics)
  firebase_messaging: ^15.1.3    # Push notifications

  # ── STATE MANAGEMENT ────────────────────────────────
  provider: ^6.1.2               # Share auth + data state across screens

  # ── UTILITIES ───────────────────────────────────────
  uuid: ^4.5.1                   # Generate unique ticket IDs
  image_picker: ^1.1.2           # Pick profile/concert images
  shared_preferences: ^2.3.3     # Persist small local data (e.g. dark mode)
  flutter_local_notifications: ^17.2.3  # Local push notifications

  # ── QR SCANNER (for admin ticket scanning) ──────────
  mobile_scanner: ^5.2.3

  # ── PAYMENT ─────────────────────────────────────────
  # Chapa is the Ethiopian payment gateway (supports Telebirr, CBE Birr, etc.)
  # Add when you get your API key from: https://chapa.co
  # chapa_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/home_1.jpeg
    - assets/img/screen_2.jpg
    - assets/img/tedy 1.jpg
    - assets/img/tedy2.jpg
    - assets/img/banners/concert 1.png
    - assets/img/banners/concert 2.png
    - assets/img/banners/concert 3.png
    - assets/img/Rophnan.jpg
    - assets/img/Zerubabbel.jpg
    - assets/img/Yohana.jpg
    - assets/img/Dawit.jpg
    - assets/img/Betty.jpg
    - assets/img/Sami.jpg
    - assets/img/placeholder.png    # ADD this image (any placeholder PNG)
